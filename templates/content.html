<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal agents</title>

    <style>
        body {
            margin: 0;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #111;
            align-items: center; 
        }

        /* ===== HEADER ===== */
        .header-container {
            text-align: center;
            padding: 28px 0;
        }

        .header-box {
            display: inline-block;
            padding: 12px 44px;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
        }

        .header-links a {
            margin: 0 20px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            color: #000;
            cursor: pointer;
        }

        .header-links a:hover {
            opacity: 0.7;
        }

        /* ===== CONTENT SECTION (2/3 PAGE) ===== */
        .content-section {
            height: 66vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            word-wrap: normal;
        }

        .content-box {
            max-width: 720px;
            text-align: center;
            align-items: center;
            font-size: 18px;
            line-height: 1.6;
            word-wrap: normal;
        }
    </style>
     <script>
        function chatData(api) {
            const section = document.getElementById("section");
            const content = document.getElementById("content-text");
        
            // Show section on button click
            section.style.display = "block";
            content.innerHTML = "Loading...";
        
            fetch(api) // internal API URL
                .then(response => response.text())
                .then(data => {
                    // Render result
                    content.innerHTML = ` <pre>${data}</pre>`;
                    
                })
                .catch(error => {
                    content.innerHTML = "Failed to load data";
                    console.error(error);
                });
            }
    </script>
</head>
<body>

    <!-- HEADER -->
    <div class="header-container">
        <div class="header-box">
            <div class="header-links">
                <a onclick="chatData('about')">About</a>
                <a onclick="chatData('local')">Local Events</a>
                <a onclick="chatData('gold')">Gold price</a>
            </div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content-section" id="section">
        <div class="content-box" id="content">
            <p id="content-text"></p>
        </div>
    </div>
   
</body>
</html>
